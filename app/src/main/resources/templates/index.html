<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nytt Projekt</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

    <nav style="margin-bottom: 2rem;">
        <a th:href="@{/}"><strong>Lägg till projekt</strong></a> |
        <a th:href="@{/search}"><strong>Sök</strong></a> |
        <a th:href="@{/reviews}"><strong>Alla utvärderingar</strong></a>
    </nav>

<h2>Lägg till projektutvärdering</h2>

<form th:action="@{/form}">
    <!-- Basic Info -->
    <label for="customer">Kund:</label><br>
    <input type="text" id="customer" name="customer" required><br><br>

    <label for="consultant">Konsult:</label><br>
    <input type="text" id="consultant" name="consultant" required><br><br>

    <label for="salesPerson">Säljare:</label><br>
    <input type="text" id="salesPerson" name="salesPerson" required><br><br>

    <label for="date">Datum:</label><br>
    <input type="date" id="date" name="date" required><br><br>

    <button type="submit">Skapa Formulär</button>
</form>

<br>

</body>
</html>
